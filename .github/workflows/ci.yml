name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install workspace
        run: uv sync --all-groups --all-packages

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        run: uv run mypy model feeder adapters comparison

      - name: Test
        run: uv run pytest -m "not slow and not bench"

  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install workspace
        run: uv sync --all-groups --all-packages

      - name: Install just
        uses: extractions/setup-just@v2

      # The YAML model is the single source of the property tree (AGENTS.md);
      # both generated artefacts must match it exactly, and hand edits to
      # generated files must fail here, loudly.
      - name: Generated model artefacts are current
        run: |
          just gen-model
          git diff --exit-code deploy/basyx adapters/opcua-server/spec \
            || { echo "::error::generated model artefacts are stale — run 'just gen-model' and commit"; exit 1; }

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose
        run: docker compose config >/dev/null

      - name: Build service images
        run: docker compose build
