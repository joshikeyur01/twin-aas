[project]
name = "aas-populator"
version = "0.1.0"
description = "MQTT -> BaSyx REST PATCH for OperationalData. Talks to an unmodified BaSyx like any integrator would."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "modelgen",            # source bindings come from ur5_model.yaml, not the AAS JSON
    "aiomqtt>=2.3",
    "httpx2",              # async REST client for the BaSyx API
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "structlog>=24.1",
    "prometheus-client>=0.20",
]

[tool.uv.sources]
modelgen = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aas_populator"]
