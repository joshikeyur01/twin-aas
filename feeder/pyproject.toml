[project]
name = "feeder"
version = "0.1.0"
description = "MQTT joints -> forward kinematics -> retained twin/ur5/pose. The one place FK runs (fairness rule)."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "aiomqtt>=2.3",
    "numpy>=2.0",          # vendored UR5 forward kinematics
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "structlog>=24.1",
    "prometheus-client>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feeder"]
