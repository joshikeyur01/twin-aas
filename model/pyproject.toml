# The single source of the property tree (AGENTS.md: model-first).
# `python -m modelgen` renders ur5_model.yaml into the BaSyx submodel JSON
# and the OPC-UA address-space spec — both checked in, both CI-gated.
[project]
name = "modelgen"
version = "0.1.0"
description = "UR5 information model (YAML) and its generators: AAS submodels + OPC-UA address-space spec."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7",   # the YAML is validated, not trusted
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelgen"]
